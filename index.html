<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e5f">
<title>屏東廠藥品品質抽查表</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<header class="top">
  <div class="top-title">
    <div class="t1">藥品品質抽查表</div>
    <div class="t2">屏東廠 · Q-06 Rev.8</div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="btnChecked" title="下載已查過清單">清單</button>
    <button class="icon-btn" id="btnHistory" title="歷史週報">歷史</button>
    <button class="icon-btn" id="btnUpload" title="上傳 Excel 更新資料">上傳</button>
    <button class="icon-btn" id="btnSettings" title="設定">設定</button>
  </div>
</header>

<main id="main">
  <div id="status" class="status hidden"></div>

  <section class="card step">
    <div class="step-head"><span class="step-no">1</span><h2>抽查日期</h2></div>
    <div class="row date-row">
      <input type="date" id="date">
      <div class="week-chip" id="weekChip">—</div>
    </div>
    <div class="hint" id="dateHint"></div>
  </section>

  <section class="card step">
    <div class="step-head">
      <span class="step-no">2</span><h2>客戶自備藥</h2>
      <button class="btn small" id="btnRandCust">一鍵隨機抽 5 筆</button>
    </div>
    <div id="custList" class="items"></div>
  </section>

  <section class="card step">
    <div class="step-head">
      <span class="step-no">3</span><h2>公司藥</h2>
      <button class="btn small" id="btnRandComp">一鍵隨機抽 5 筆</button>
    </div>
    <div id="compList" class="items"></div>
  </section>

  <section class="card step">
    <div class="step-head"><span class="step-no">4</span><h2>確認送出</h2></div>
    <div id="summary"></div>
    <div class="actions">
      <button class="btn primary big" id="btnSave">送出並下載 Excel</button>
      <button class="btn big ghost" id="btnDownload">只下載 Excel（不送出）</button>
    </div>
  </section>
  <p class="foot">資料來源：Google Sheet（Sheet3／Sheet1／工作表1／Sheet5／公司藥主檔）</p>
</main>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="sheet-head"><h3 id="modalTitle"></h3><button class="icon-btn" id="modalClose">關閉</button></div>
    <div class="sheet-body" id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="jszip.min.js?v=6"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="config.js?v=6"></script>
<script src="core.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
